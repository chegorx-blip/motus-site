:root{
  --pine:#21463A;
  --ink:#14201A;
  --bronze:#B4894E;
  --sage:#4A6D5E;
  --stone:#E9E4D9;
  --paper:#F6F3ED;

  --bg: var(--paper);
  --bg-panel: var(--pine);
  --text: var(--ink);
  --text-on-panel: var(--paper);
  --text-muted: var(--sage);
  --accent: var(--bronze);
  --surface: #ffffff;
  --border: rgba(74,109,94,0.28);
  --dot: var(--bronze);
  --line: rgba(74,109,94,0.35);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg: var(--ink);
    --bg-panel: var(--pine);
    --text: var(--paper);
    --text-on-panel: var(--paper);
    --text-muted: var(--stone);
    --accent: var(--bronze);
    --surface: rgba(246,243,237,0.045);
    --border: rgba(233,228,217,0.16);
    --dot: var(--bronze);
    --line: rgba(233,228,217,0.22);
  }
}
:root[data-theme="dark"]{
  --bg: var(--ink);
  --bg-panel: var(--pine);
  --text: var(--paper);
  --text-on-panel: var(--paper);
  --text-muted: var(--stone);
  --accent: var(--bronze);
  --surface: rgba(246,243,237,0.045);
  --border: rgba(233,228,217,0.16);
  --dot: var(--bronze);
  --line: rgba(233,228,217,0.22);
}
:root[data-theme="light"]{
  --bg: var(--paper);
  --bg-panel: var(--pine);
  --text: var(--ink);
  --text-on-panel: var(--paper);
  --text-muted: var(--sage);
  --accent: var(--bronze);
  --surface: #ffffff;
  --border: rgba(74,109,94,0.28);
  --dot: var(--bronze);
  --line: rgba(74,109,94,0.35);
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
html,body{margin:0;padding:0;overflow-x:hidden;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'IBM Plex Sans','Golos Text',sans-serif;
  font-size:15px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3{
  font-family:'Golos Text','IBM Plex Sans',sans-serif;
  font-weight:700;
  color:var(--text);
  margin:0;
  text-wrap:balance;
}
.mono{
  font-family:'IBM Plex Mono','IBM Plex Sans',monospace;
  text-transform:uppercase;
  letter-spacing:0.18em;
  font-size:11px;
}
p{margin:0;}
button{font-family:inherit;}
a{color:inherit;}

.wrap{
  max-width:720px;
  margin:0 auto;
  padding:0 24px;
}
.wrap-wide{max-width:1120px;}

.hero-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:36px;
  align-items:center;
}
@media (min-width:860px){
  .hero-grid{grid-template-columns:1.05fr 0.95fr; gap:48px;}
}
.hero-media{
  position:relative;
  opacity:0;
  transform:translateY(16px) scale(0.98);
  max-width:400px;
  margin:0 auto;
}
.hero.ready .hero-media{animation:riseMedia .7s ease .48s forwards;}
@keyframes riseMedia{to{opacity:1; transform:translateY(0) scale(1);}}
.hero-photo-main{
  position:relative;
  border-radius:4px;
  overflow:hidden;
  aspect-ratio:3/4;
}
.hero-photo-main::before,
.hero-photo-main::after{
  content:"";
  position:absolute;
  width:22px; height:22px;
  border:1.5px solid var(--bronze);
  z-index:1;
  opacity:.85;
  pointer-events:none;
}
.hero-photo-main::before{top:12px; left:12px; border-right:none; border-bottom:none;}
.hero-photo-main::after{bottom:12px; right:12px; border-left:none; border-top:none;}
.hero-photo-main img{
  width:100%; height:100%;
  object-fit:cover;
  display:block;
  animation:kenburns 15s ease-in-out infinite alternate;
}
@keyframes kenburns{from{transform:scale(1);} to{transform:scale(1.08);}}
.hero-photo-accent{
  position:absolute;
  width:44%;
  aspect-ratio:4/3;
  right:-10%;
  bottom:-10%;
  border-radius:4px;
  overflow:hidden;
  border:4px solid var(--bg);
  box-shadow:0 10px 28px rgba(20,32,26,0.22);
}
.hero-photo-accent img{width:100%;height:100%;object-fit:cover;display:block;}

/* ---------- route strip (hero signature element) ---------- */
.route-strip{
  display:flex; align-items:center;
  max-width:960px; margin:0 auto;
  padding:26px 24px 22px;
  opacity:0; transform:translateY(-8px);
}
.hero.ready .route-strip{animation:riseRoute .6s ease .1s forwards;}
@keyframes riseRoute{to{opacity:1; transform:translateY(0);}}
.route-stop{display:flex; align-items:center; gap:8px; flex:none;}
.route-stop-label{
  font-family:'IBM Plex Mono',monospace;
  font-size:clamp(9px,1.6vw,11px);
  letter-spacing:0.14em; text-transform:uppercase;
  color:var(--text-muted); white-space:nowrap;
}
.route-stop-dot{width:8px;height:8px;border-radius:50%; flex:none;}
.route-stop-dot.start{background:var(--bronze); animation:beacon 2.6s ease-in-out infinite;}
.route-stop-dot.end{background:var(--bg); border:1.5px solid var(--bronze); box-sizing:border-box;}
.route-stop-icon{width:15px;height:15px; flex:none; stroke:var(--text-muted); fill:none; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round;}
.route-seg{
  flex:1 1 28px; min-width:16px; height:1px;
  background:var(--line);
  margin:0 10px;
}
@media (max-width:640px){
  .route-strip{padding:16px 16px 18px;}
  .route-stop-label{display:none;}
  .route-seg{margin:0 8px;}
}
@media (prefers-reduced-motion: reduce){
  .route-strip{opacity:1 !important; transform:none !important; animation:none !important;}
  .route-stop-dot.start{animation:none !important;}
}

.about-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:28px;
  align-items:center;
}
@media (min-width:860px){
  .about-grid{grid-template-columns:1fr 0.8fr; gap:44px;}
}
.about-media{
  border-radius:4px;
  overflow:hidden;
  aspect-ratio:3/4;
  max-width:300px;
  margin:0 auto;
}
@media (min-width:860px){.about-media{margin:0 0 0 auto;}}
.about-media video{width:100%;height:100%;object-fit:cover;display:block;}

@media (prefers-reduced-motion: reduce){
  .hero-photo-main img{animation:none !important;}
  .hero-media{opacity:1 !important; transform:none !important; animation:none !important;}
}

/* ---------- header ---------- */
.topbar{
  background:var(--pine);
}
.topbar-inner{
  max-width:none;
  margin:0;
  display:flex;
  align-items:center;
  padding:16px 24px;
}
@media (max-width:640px){
  .topbar-inner{padding:12px 16px;}
}
.logo-mark{
  display:block;
  text-decoration:none;
  flex:none;
}
.logo-mark svg{
  display:block;
  height:60px;
  width:auto;
}
@media (max-width:640px){
  .logo-mark svg{height:42px;}
}
.logo-dot{animation:beacon 2.6s ease-in-out infinite;}
@keyframes beacon{
  0%,100%{fill-opacity:1;}
  50%{fill-opacity:0.5;}
}
.langswitch{
  display:flex;
  gap:14px;
}
.langswitch button{
  background:none;
  border:none;
  padding:4px 0;
  color:var(--stone);
  cursor:pointer;
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:0.14em;
  border-bottom:1.5px solid transparent;
  transition:color .2s ease, border-color .2s ease;
}
.langswitch button:hover{color:var(--paper);}
.langswitch button[aria-pressed="true"]{
  color:var(--paper);
  border-bottom-color:var(--bronze);
}
.langswitch button:focus-visible{outline:2px solid var(--bronze);outline-offset:3px;}

.topbar-right{
  display:flex;
  align-items:center;
  gap:18px;
  margin-left:auto;
}
.header-phone{
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:var(--paper);
  text-decoration:none;
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
  letter-spacing:0.02em;
  padding-right:16px;
  border-right:1px solid rgba(246,243,237,0.22);
  transition:color .18s ease;
}
.header-phone:hover{color:var(--bronze);}
.header-phone svg{
  width:15px;height:15px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.75;
  stroke-linecap:round;
  stroke-linejoin:round;
  flex:none;
}
@media (max-width:900px){
  .header-phone span{display:none;}
  .header-phone{padding-right:10px;}
}
.header-contacts{
  display:flex;
  gap:8px;
  padding-right:14px;
  border-right:1px solid rgba(246,243,237,0.22);
}
.header-contacts a{
  height:30px;
  padding:0 11px 0 9px;
  border-radius:15px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:var(--stone);
  border:1px solid rgba(246,243,237,0.28);
  transition:color .18s ease, border-color .18s ease;
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  letter-spacing:0.08em;
  text-decoration:none;
}
.header-contacts a:hover{color:var(--bronze); border-color:var(--bronze);}
.header-contacts svg{
  width:14px;height:14px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.75;
  stroke-linecap:round;
  stroke-linejoin:round;
  flex:none;
}
@media (max-width:460px){
  .header-contacts{padding-right:10px; gap:6px;}
  .header-contacts a span{display:none;}
  .header-contacts a{width:28px; height:28px; padding:0; justify-content:center; border-radius:50%;}
}

/* ---------- hero ---------- */
.hero{
  padding:56px 0 48px;
}
.eyebrow{
  color:var(--accent);
  margin-bottom:18px;
  opacity:0;
  white-space:nowrap;
  font-size:clamp(8.5px, 2.4vw, 11px);
  letter-spacing:clamp(0.06em, 1.6vw, 0.18em);
}
h1.headline{
  font-size:clamp(30px, 3.6vw + 14px, 42px);
  line-height:1.14;
  margin-bottom:20px;
  opacity:0;
}
.subhead{
  font-size:17px;
  line-height:1.6;
  color:var(--text-muted);
  max-width:44ch;
  margin-bottom:32px;
  opacity:0;
}
.cta-row{
  display:flex;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
  opacity:0;
}
.quick-popover{
  max-width:460px;
  margin-top:0;
  max-height:0;
  overflow:hidden;
  opacity:0;
  transition:max-height .35s ease, opacity .3s ease, margin-top .35s ease;
}
.quick-popover.open{
  max-height:220px;
  opacity:1;
  margin-top:18px;
}
.quick-popover-perks{
  display:inline-block;
  color:var(--accent);
  background:var(--surface);
  border:1px solid var(--border);
  padding:7px 12px;
  border-radius:3px;
  margin-bottom:12px;
}
@media (prefers-reduced-motion: reduce){
  .quick-popover{transition:none;}
}
.quick-form{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  width:100%;
  max-width:460px;
}
.quick-form input{
  grid-column:span 1;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:3px;
  padding:11px 13px;
  color:var(--text);
  font-family:'IBM Plex Sans',sans-serif;
  font-size:14px;
  width:100%;
}
.quick-form input::placeholder{color:var(--text-muted); opacity:0.75;}
.quick-form input:focus{outline:none; border-color:var(--accent);}
.quick-form input[name="qName"]{grid-column:1/2;}
.quick-form input[name="qContact"]{grid-column:2/3;}
.quick-form input[name="qModel"]{grid-column:1/2;}
.quick-form .btn{grid-column:2/3; justify-content:center;}
@media (max-width:520px){
  .quick-form{grid-template-columns:1fr;}
  .quick-form input,.quick-form .btn{grid-column:1/-1;}
}
.quick-form-success{
  display:none;
  max-width:460px;
  margin-top:10px;
  padding:11px 14px;
  border:1px solid rgba(180,137,78,0.5);
  border-radius:3px;
  background:rgba(180,137,78,0.1);
  color:var(--text);
  font-size:13px;
}
.quick-form-success.visible{display:block;}
.quick-form.submitted{display:none;}

.hero-below-form{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:18px;
  margin-top:14px;
}
.detailed-link{
  background:none;
  border:none;
  padding:0;
  color:var(--text-muted);
  font-size:13px;
  text-decoration:underline;
  text-underline-offset:3px;
  cursor:pointer;
}
.detailed-link:hover{color:var(--accent);}

.hero-talk{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:14px;
  font-weight:600;
  color:var(--text);
}
.hero-talk a{
  width:36px; height:36px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--paper);
  background:var(--bg-panel);
  border:none;
  box-shadow:0 4px 12px rgba(20,32,26,0.2);
  transition:filter .18s ease;
  animation:heroIconPulse 5s ease-in-out infinite;
}
.hero-talk a:nth-child(2){animation-delay:0s;}
.hero-talk a:nth-child(3){animation-delay:1.1s;}
.hero-talk a:hover{filter:brightness(1.15);}
@keyframes heroIconPulse{
  0%, 16%, 100%{transform:translateY(0) scale(1);}
  6%{transform:translateY(-3px) scale(1.12);}
  11%{transform:translateY(0) scale(1);}
}
@media (prefers-reduced-motion: reduce){
  .hero-talk a{animation:none;}
}
.hero-talk svg{
  width:16px; height:16px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.75;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:13px 22px;
  font-size:14px;
  font-weight:600;
  border-radius:3px;
  border:1px solid transparent;
  cursor:pointer;
  transition:transform .18s ease, filter .18s ease, background .18s ease;
  text-decoration:none;
}
.btn:active{transform:translateY(1px);}
.btn-primary{
  background:var(--bg-panel);
  color:var(--text-on-panel);
}
.btn-primary:hover{filter:brightness(1.12);}
.btn-secondary{
  background:transparent;
  color:var(--text);
  border-color:var(--border);
}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent);}

.hero.ready .eyebrow{animation:rise .6s ease .05s forwards;}
.hero.ready .headline{animation:rise .6s ease .16s forwards;}
.hero.ready .subhead{animation:rise .6s ease .28s forwards;}
.hero.ready .cta-row{animation:rise .6s ease .4s forwards;}

@keyframes rise{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}

/* ---------- section shell ---------- */
section{
  padding:52px 0;
  border-top:1px solid var(--border);
}
.reveal{
  opacity:0;
  transform:translateY(14px);
  transition:opacity .6s ease, transform .6s ease;
}
.reveal.in{opacity:1; transform:translateY(0);}

/* ---------- about ---------- */
.about h2{font-size:22px; margin-bottom:16px;}
.about p{max-width:58ch; color:var(--text);}

/* ---------- advantages ---------- */
.advantages-grid{
  position:relative;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:28px;
  margin-top:8px;
}
.connector-line{
  position:absolute;
  top:9px;
  left:16.6667%;
  right:16.6667%;
  height:1px;
  background:var(--line);
  display:none;
  transform:scaleX(0);
  transform-origin:left center;
  transition:transform 1s ease .15s;
}
@media (min-width:640px){
  .connector-line{display:block;}
}
.reveal.in .connector-line{transform:scaleX(1);}
.advantage{position:relative;}
.advantage .dot{
  width:9px;height:9px;border-radius:50%;
  background:var(--dot);
  margin-bottom:14px;
  position:relative;
  z-index:1;
  transform:scale(0);
  transition:transform .35s ease;
}
.reveal.in .advantage:nth-child(1) .dot{transition-delay:.25s; transform:scale(1);}
.reveal.in .advantage:nth-child(2) .dot{transition-delay:.45s; transform:scale(1);}
.reveal.in .advantage:nth-child(3) .dot{transition-delay:.65s; transform:scale(1);}
.advantage svg{
  width:26px;height:26px;
  stroke:var(--text);
  fill:none;
  stroke-width:1.75;
  stroke-linecap:round;
  stroke-linejoin:round;
  margin-bottom:12px;
  display:block;
}
.advantage h3{font-size:16px; margin-bottom:8px;}
.advantage p{font-size:14px; color:var(--text-muted);}

/* ---------- topbar nav links ---------- */
.topbar-nav{
  display:flex; align-items:center; gap:22px;
  margin-left:32px;
}
.topbar-nav a{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
  color:var(--stone); text-decoration:none; white-space:nowrap;
  padding:4px 0; border-bottom:1.5px solid transparent;
  transition:color .2s ease, border-color .2s ease;
}
.topbar-nav a:hover, .topbar-nav a:focus-visible{color:var(--paper); border-bottom-color:var(--bronze);}
@media (max-width:900px){ .topbar-nav{display:none;} }

.topbar-cta{
  font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink); background:var(--bronze); padding:8px 16px; border-radius:4px; text-decoration:none;
  transition:filter .2s ease; white-space:nowrap;
}
.topbar-cta:hover{filter:brightness(1.08);}
@media (max-width:640px){ .topbar-cta{display:none;} }

/* ---------- partner / payment strips ---------- */
.partner-strip, .payment-strip{
  border:1px solid var(--border);
  border-radius:6px;
  padding:22px 24px;
  margin-top:28px;
  display:flex; align-items:flex-start; gap:16px;
}
.partner-strip svg, .payment-strip svg{
  width:26px;height:26px; flex:none; margin-top:2px;
  stroke:var(--bronze); fill:none; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round;
}
.partner-strip h3, .payment-strip h3{font-size:15px; margin-bottom:4px;}
.partner-strip p, .payment-strip p{font-size:14px; color:var(--text-muted); margin:0;}

/* ---------- hero cyprus line ---------- */
.hero-trust-line{
  display:flex; align-items:center; gap:7px;
  margin-top:16px;
  font-size:13px;
  color:var(--text-muted);
}
.hero-trust-line svg{
  width:16px;height:16px; flex:none;
  stroke:var(--bronze); fill:none; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round;
}
.hero-cyprus-line{
  margin-top:10px;
  font-size:13px;
  color:var(--text-muted);
}
.hero-cyprus-line button{
  background:none; border:none; padding:0; margin-left:4px;
  color:var(--text); text-decoration:underline; text-underline-offset:3px;
  cursor:pointer; font:inherit;
}
.hero-cyprus-line button:hover{color:var(--bronze);}

@media (max-width:639px){
  .advantages-grid{grid-template-columns:1fr; gap:26px;}
}

/* ---------- testimonial ---------- */
.testimonial-box{
  border:1px dashed var(--border);
  border-radius:3px;
  padding:24px 24px 20px;
  background:var(--surface);
}
.placeholder-tag{
  display:inline-block;
  color:var(--accent);
  margin-bottom:14px;
}
.testimonial-box blockquote{
  margin:0 0 14px;
  font-style:italic;
  color:var(--text-muted);
  font-size:15px;
  line-height:1.6;
}
.testimonial-box cite{
  font-style:normal;
  font-size:13px;
  color:var(--text-muted);
  opacity:0.8;
}

/* ---------- final cta ---------- */
.final{
  background:var(--bg-panel);
  color:var(--text-on-panel);
  border-top:none;
  margin-top:0;
}
.final .wrap{padding-top:52px;padding-bottom:56px;}
.route-mark{width:100px; margin-bottom:12px;}
.route-mark svg{width:100%; height:auto; display:block;}
.route-dot{fill:var(--bronze); animation:beacon 2.6s ease-in-out infinite;}
.route-line{
  stroke:rgba(246,243,237,0.35);
  stroke-width:1.5;
  stroke-dasharray:86;
  stroke-dashoffset:86;
  transition:stroke-dashoffset 1.1s ease .2s;
}
.reveal.in .route-line{stroke-dashoffset:0;}

.final h2{
  color:var(--text-on-panel);
  font-size:clamp(26px, 3vw + 14px, 36px);
  margin-bottom:14px;
}
.final p{
  color:var(--stone);
  max-width:44ch;
  margin-bottom:28px;
}
.final .btn-primary{
  background:var(--accent);
  color:var(--ink);
}
.final .btn-primary:hover{filter:brightness(1.08);}
.contact-line{
  margin-top:18px;
  font-size:13px;
  color:var(--stone);
  opacity:0.85;
}

@media (prefers-reduced-motion: reduce){
  .hero .eyebrow,.hero .headline,.hero .subhead,.hero .cta-row{
    animation:none !important; opacity:1 !important;
  }
  .reveal{opacity:1 !important; transform:none !important; transition:none !important;}
  .connector-line{transition:none !important; transform:scaleX(1) !important;}
  .advantage .dot{transition:none !important; transform:scale(1) !important;}
  .logo-dot{animation:none !important;}
  .route-dot{animation:none !important;}
  .route-line{transition:none !important; stroke-dashoffset:0 !important;}
  .chatfab-ring{animation:none !important;}
  .chatfab-toggle,.chatfab-item{animation:none !important;}
}

/* ---------- contacts ---------- */
.request-form{
  margin-top:8px;
  margin-bottom:36px;
  max-width:420px;
}
.request-tabs{
  display:flex;
  gap:0;
  border:1px solid rgba(246,243,237,0.28);
  border-radius:3px;
  overflow:hidden;
  margin-bottom:20px;
}
.request-tab{
  flex:1;
  background:none;
  border:none;
  color:var(--stone);
  padding:11px 10px;
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  cursor:pointer;
  transition:background .18s ease, color .18s ease;
}
.request-tab + .request-tab{border-left:1px solid rgba(246,243,237,0.28);}
.request-tab.active{background:var(--bronze); color:var(--ink);}
.request-tab:not(.active):hover{background:rgba(246,243,237,0.08);}

.request-perks{
  margin-bottom:18px;
  padding:14px;
  border:1px solid rgba(180,137,78,0.4);
  border-radius:3px;
  background:rgba(180,137,78,0.08);
}
.request-perk-group{display:none; flex-direction:column; gap:10px;}
.request-perk-group.active{display:flex;}
.request-perk{
  display:flex;
  flex-direction:column;
  gap:2px;
  font-size:13px;
  color:var(--paper);
  line-height:1.5;
}
.request-perk .mono{
  color:var(--bronze);
  font-size:10px;
  letter-spacing:0.12em;
}

.request-fields{
  display:flex;
  flex-direction:column;
  gap:14px;
  margin-bottom:18px;
}
.request-field{
  display:flex;
  flex-direction:column;
  gap:6px;
}
.request-field span{
  color:var(--stone);
  letter-spacing:0.14em;
}
.request-field input{
  background:rgba(246,243,237,0.07);
  border:1px solid rgba(246,243,237,0.28);
  border-radius:3px;
  padding:10px 12px;
  color:var(--paper);
  font-family:'IBM Plex Sans',sans-serif;
  font-size:14px;
  transition:border-color .18s ease, background .18s ease;
}
.request-field input::placeholder{color:rgba(233,228,217,0.45);}
.request-field input:focus{
  outline:none;
  border-color:var(--bronze);
  background:rgba(246,243,237,0.11);
}
.request-field input:invalid:not(:placeholder-shown){border-color:#c97b6b;}

.request-submit{
  background:var(--bronze);
  color:var(--ink);
  border:none;
  width:100%;
  justify-content:center;
}
.request-submit:hover{filter:brightness(1.08);}

.request-success{
  display:none;
  margin-top:14px;
  padding:12px 14px;
  border:1px solid rgba(180,137,78,0.5);
  border-radius:3px;
  background:rgba(180,137,78,0.12);
  color:var(--paper);
  font-size:13px;
}
.request-success.visible{display:block;}
.order-card.submitted .request-tabs,
.order-card.submitted .request-perks,
.order-card.submitted .request-groups,
.order-card.submitted .request-consent,
.order-card.submitted .request-submit{display:none;}

/* ---------- order page (standalone request form) ---------- */
.order-main{padding:48px 0 64px;}
.order-back-link{
  display:inline-block;
  margin-bottom:22px;
  font-family:'IBM Plex Mono',monospace;
  font-size:12px; letter-spacing:0.06em;
  color:var(--text-muted); text-decoration:none;
}
.order-back-link:hover{color:var(--bronze);}
.order-card{
  max-width:640px;
  margin:0 auto;
  background:var(--pine);
  border-radius:4px;
  box-shadow:0 20px 50px rgba(10,16,13,0.22);
  padding:36px 32px 32px;
  color:var(--paper);
}
@media (max-width:640px){ .order-card{padding:28px 20px 24px;} }
.order-card .route-mark-static .route-line{stroke-dashoffset:0; transition:none;}
.order-card-title{
  color:var(--paper);
  font-size:clamp(22px, 2.4vw + 12px, 28px);
  margin-bottom:20px;
}
.order-card .request-tabs{margin-bottom:16px;}
.order-card .request-perks{margin-bottom:22px;}

.chatfab-item-primary{
  background:var(--pine);
  border-color:var(--pine);
  color:var(--paper);
}
.chatfab-item-primary svg{stroke:var(--paper);}
.chatfab-item-primary:hover{filter:brightness(1.15);}

.contacts-block{
  margin-top:26px;
  padding-top:22px;
  border-top:1px solid rgba(233,228,217,0.18);
  display:flex;
  flex-direction:column;
  gap:10px;
}
.contacts-title{
  color:var(--accent);
  margin-bottom:4px;
}
.contact-row{
  display:inline-flex;
  align-items:center;
  gap:10px;
  color:var(--stone);
  text-decoration:none;
  font-size:14px;
  width:fit-content;
  transition:color .18s ease;
}
.contact-row:hover{color:var(--paper);}
.contact-row svg{
  width:16px;height:16px;flex:none;
  stroke:currentColor;
  fill:none;
  stroke-width:1.75;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* ---------- floating chat ---------- */
.chatfab{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:60;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:10px;
  opacity:0;
  transform:translateY(10px);
  animation:fabIn .5s ease 1.1s forwards;
}
@keyframes fabIn{to{opacity:1; transform:translateY(0);}}

.chatfab-toggle{
  position:relative;
  width:52px;height:52px;
  border-radius:50%;
  background:var(--pine);
  border:none;
  color:var(--paper);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 6px 18px rgba(20,32,26,0.28);
  transition:filter .18s ease, transform .18s ease;
}
.chatfab-toggle:hover{filter:brightness(1.12);}
.chatfab-toggle:active{transform:scale(0.96);}
.chatfab-toggle svg{
  width:22px;height:22px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.75;
  stroke-linecap:round;
  stroke-linejoin:round;
  position:relative;
  z-index:1;
  transition:transform .25s ease;
}
.chatfab-ring{
  position:absolute;
  inset:0;
  border-radius:50%;
  border:1.5px solid var(--bronze);
  animation:ring 2.6s ease-out infinite;
}
@keyframes ring{
  0%{transform:scale(1); opacity:0.65;}
  100%{transform:scale(1.55); opacity:0;}
}
.chatfab-menu{
  display:flex;
  flex-direction:column;
  gap:8px;
  align-items:flex-end;
}
.chatfab-menu-label{
  color:var(--stone);
  background:var(--surface);
  border:1px solid var(--border);
  padding:6px 10px;
  border-radius:3px;
}
.chatfab-item{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:9px 14px;
  border-radius:3px;
  background:var(--pine);
  border:none;
  color:var(--paper);
  text-decoration:none;
  font-size:13px;
  font-weight:600;
  box-shadow:0 4px 14px rgba(20,32,26,0.3);
  opacity:0;
  transform:translateY(6px) scale(0.98);
  pointer-events:none;
  transition:opacity .2s ease, transform .2s ease;
}
.chatfab-item svg{
  width:15px;height:15px;
  stroke:var(--paper);
  fill:none;
  stroke-width:1.75;
  stroke-linecap:round;
  stroke-linejoin:round;
}

  ],
  japan:[
    {group:'grpContact', fields:[
      {key:'firstName', type:'text', required:true, name:'jpFirstName'},
      {key:'lastName', type:'text', required:true, name:'jpLastName'},
      {key:'phone', type:'tel', required:true, name:'jpPhone', placeholder:'placeholderPhone'},
      {key:'telegram', type:'text', required:false, name:'jpTelegram', placeholder:'placeholderTelegram'},
      {key:'email', type:'email', required:false, name:'jpEmail'},
      {key:'city', type:'select', required:false, name:'jpCity', options:'cityOptions'}
    ]},
    {group:'grpVehicle', fields:[
      {key:'model', type:'text', required:true, name:'jpModel', full:true},
      {key:'color', type:'text', required:false, name:'jpColor', full:true},
      {key:'budgetFrom', type:'text', required:true, name:'jpBudgetFrom', placeholder:'placeholderBudgetFrom'},
      {key:'budgetTo', type:'text', required:true, name:'jpBudgetTo', placeholder:'placeholderBudgetTo'},
      {key:'yearLimit', type:'select', required:false, name:'jpYearLimit', options:'yearLimitOptions', full:true},
      {key:'engine', type:'select', required:false, name:'jpEngine', options:'engineOptions', full:true},
      {key:'mileageFrom', type:'text', required:false, name:'jpMileageFrom'},
      {key:'mileageTo', type:'text', required:false, name:'jpMileageTo'},
      {key:'extra', type:'textarea', required:false, name:'jpExtra', full:true},
      {key:'timing', type:'radio', required:true, name:'jpTiming', options:'timingOptions', full:true}
    ]}
  ]
};

const STORAGE_KEY = 'motus_preview_lang';
let requestIntent = 'japan';

function detectLang(){
  const saved = localStorage.getItem(STORAGE_KEY);
  if(saved && content[saved]) return saved;
  const nav = (navigator.language || 'en').toLowerCase();
  if(nav.startsWith('ru')) return 'ru';
  if(nav.startsWith('el')) return 'el';
  return 'en';
}

function fieldEl(field, strings){
  const wrap = document.createElement('label');
  wrap.className = 'request-field' + (field.full ? ' full' : '');

  if(field.type === 'text' || field.type === 'tel' || field.type === 'email'){
    const span = document.createElement('span');
    span.className = 'mono';
    span.textContent = strings[field.key] || field.key;
    const input = document.createElement('input');
    input.type = field.type;
    input.name = field.name;
    if(field.required) input.required = true;
    if(field.placeholder) input.placeholder = strings[field.placeholder] || '';
    wrap.appendChild(span);
    wrap.appendChild(input);
  } else if(field.type === 'textarea'){
    const span = document.createElement('span');
    span.className = 'mono';
    span.textContent = strings[field.key] || field.key;
    const ta = document.createElement('textarea');
    ta.name = field.name;
    if(field.required) ta.required = true;
    wrap.appendChild(span);
    wrap.appendChild(ta);
  } else if(field.type === 'select'){
    const span = document.createElement('span');
    span.className = 'mono';
    span.textContent = strings[field.key] || field.key;
    const sel = document.createElement('select');
    sel.name = field.name;
    if(field.required) sel.required = true;
    const placeholderOpt = document.createElement('option');
    placeholderOpt.value = '';
    placeholderOpt.textContent = '—';
    sel.appendChild(placeholderOpt);
    const opts = strings.options[field.options] || [];
    opts.forEach(optText=>{
      const opt = document.createElement('option');
      opt.value = optText;
      opt.textContent = optText;
      sel.appendChild(opt);
    });
    wrap.appendChild(span);
    wrap.appendChild(sel);
  } else if(field.type === 'radio'){
    const span = document.createElement('span');
    span.className = 'mono';
    span.textContent = strings[field.key] || field.key;
    wrap.appendChild(span);
    const group = document.createElement('div');
    group.className = 'chip-group';
    group.setAttribute('role', 'radiogroup');
    const opts = strings.options[field.options] || [];
    opts.forEach((optText, i)=>{
      const chip = document.createElement('label');
      chip.className = 'chip';
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = field.name;
      input.value = optText;
      if(field.required && i === 0) input.required = true;
      const span2 = document.createElement('span');
      span2.textContent = optText;
      chip.appendChild(input);
      chip.appendChild(span2);
      group.appendChild(chip);
    });
    wrap.appendChild(group);
  }
  return wrap;
}

function renderFormGroups(lang, intent){
  const container = document.getElementById('requestGroups');
  if(!container) return;
  const strings = content[lang].fields;
  const schema = formSchema[intent];
  container.innerHTML = '';
  schema.forEach(groupDef=>{
    const groupEl = document.createElement('div');
    groupEl.className = 'request-group';
    const title = document.createElement('div');
    title.className = 'mono request-group-title';
    title.textContent = strings[groupDef.group] || groupDef.group;
    groupEl.appendChild(title);
    const grid = document.createElement('div');
    grid.className = 'request-group-grid';
    groupDef.fields.forEach(field=>{
      grid.appendChild(fieldEl(field, strings));
    });
    groupEl.appendChild(grid);
    container.appendChild(groupEl);
  });
  const consent0Row = document.getElementById('consent0Row');
  if(consent0Row) consent0Row.style.display = (intent === 'japan') ? 'flex' : 'none';
}

function render(lang){
  const dict = content[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(dict[key] !== undefined) el.textContent = dict[key];
  });
  document.querySelectorAll('.langswitch button').forEach(btn=>{
    btn.setAttribute('aria-pressed', btn.dataset.lang === lang ? 'true' : 'false');
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
    const key = el.getAttribute('data-i18n-placeholder');
    if(dict.fields && dict.fields[key] !== undefined) el.placeholder = dict.fields[key];
  });
  renderFormGroups(lang, requestIntent);
  localStorage.setItem(STORAGE_KEY, lang);
}

document.querySelectorAll('.langswitch button').forEach(btn=>{
  btn.addEventListener('click', ()=> render(btn.dataset.lang));
});

render(detectLang());

const io = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      e.target.classList.add('in');
      io.unobserve(e.target);
    }
  });
}, {threshold:0.15});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

const chatFab = document.getElementById('chatFab');
const chatFabToggle = document.getElementById('chatFabToggle');
chatFabToggle.addEventListener('click', (e)=>{
  e.stopPropagation();
  const open = chatFab.classList.toggle('open');
  chatFabToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
});
document.addEventListener('click', (e)=>{
  if(chatFab.classList.contains('open') && !chatFab.contains(e.target)){
    chatFab.classList.remove('open');
    chatFabToggle.setAttribute('aria-expanded', 'false');
  }
});

const PROMPT_KEY = 'motus_chat_prompt_shown';
const chatFabPrompt = document.getElementById('chatFabPrompt');
const chatFabPromptClose = document.getElementById('chatFabPromptClose');
let promptTimer = null;

function showPrompt(){
  if(sessionStorage.getItem(PROMPT_KEY)) return;
  if(chatFab.classList.contains('open')) return;
  chatFabPrompt.classList.add('visible');
}
function dismissPrompt(){
  chatFabPrompt.classList.remove('visible');
  sessionStorage.setItem(PROMPT_KEY, '1');
  if(promptTimer) clearTimeout(promptTimer);
}

if(!sessionStorage.getItem(PROMPT_KEY)){
  promptTimer = setTimeout(showPrompt, 7000);
}

chatFabPromptClose.addEventListener('click', (e)=>{
  e.stopPropagation();
  dismissPrompt();
});

/* ---------- request form (this page IS the form, no modal to open/close) ---------- */
const requestModal = document.getElementById('requestModal'); // the .order-card, kept name for JS below
const requestForm = document.getElementById('requestForm');
const requestSuccess = document.getElementById('requestSuccess');
const requestPerks = document.getElementById('requestPerks');

chatFabPrompt.addEventListener('click', (e)=>{
  if(e.target === chatFabPromptClose) return;
  dismissPrompt();
  chatFab.classList.remove('open');
  chatFabToggle.setAttribute('aria-expanded', 'false');
  const firstInput = requestForm.querySelector('input, select, textarea');
  if(firstInput) firstInput.focus();
});

document.querySelectorAll('.request-tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.request-tab').forEach(t=>{
      t.classList.remove('active');
      t.setAttribute('aria-selected', 'false');
    });
    tab.classList.add('active');
    tab.setAttribute('aria-selected', 'true');
    requestIntent = tab.dataset.intent;
    document.querySelectorAll('.request-perk-group').forEach(g=>{
      g.classList.toggle('active', g.dataset.group === requestIntent);
    });
    renderFormGroups(document.documentElement.lang || 'en', requestIntent);
  });
});

// Cold-open support: a QR code or shared link can point straight at the Cyprus
// intent (?intent=cyprus) and/or tag its traffic source (?src=reception, etc.)
// for later analytics — the src value rides along as a hidden field once the
// form is wired to a real backend. Runs after the tab listeners above are
// attached, so the programmatic .click() actually triggers the tab switch.
const urlParams = new URLSearchParams(location.search);
if(urlParams.get('intent') === 'cyprus'){
  const cyBtn = document.getElementById('tabCyprusBtn');
  if(cyBtn) cyBtn.click();
}
const srcParam = urlParams.get('src');
if(srcParam){
  const srcField = document.createElement('input');
  srcField.type = 'hidden';
  srcField.name = 'src';
  srcField.value = srcParam;
  requestForm.appendChild(srcField);
}

// Google Apps Script Web App URL — deploy motus-apps-script.gs in the
// "MOTUS CRM — Рабочая" Sheet (Extensions -> Apps Script -> Deploy -> Web app),
// then paste the resulting /exec URL here.
const CRM_WEBHOOK_URL = 'REPLACE_WITH_APPS_SCRIPT_WEB_APP_URL';

// The <form> uses per-intent field name prefixes (cyModel/jpModel, etc.) so both
// tabs can share one <form> without id collisions. Strip the "cy"/"jp" prefix and
// lowercase the first letter so both flows write to the same CRM column names.
function stripIntentPrefix(name, intent){
  const prefix = intent === 'cyprus' ? 'cy' : 'jp';
  if(!name.startsWith(prefix)) return name;
  const rest = name.slice(prefix.length);
  return rest.charAt(0).toLowerCase() + rest.slice(1);
}

requestForm.addEventListener('submit', (e)=>{
  e.preventDefault();
  if(!requestForm.checkValidity()){
    requestForm.reportValidity();
    return;
  }

  const formData = new FormData(requestForm);
  const payload = { intent: requestIntent };
  for(const [name, value] of formData.entries()){
    if(name === 'src'){ payload.source = value; continue; }
    payload[stripIntentPrefix(name, requestIntent)] = value;
  }

  const submitBtn = requestForm.querySelector('.request-submit');
  if(submitBtn) submitBtn.disabled = true;

  fetch(CRM_WEBHOOK_URL, {
    method: 'POST',
    // Apps Script Web Apps don't support proper CORS preflight for JSON content-type
    // from a different origin; text/plain avoids the preflight while Apps Script's
    // doPost still reads e.postData.contents as the raw JSON string via JSON.parse().
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
  })
    .catch(err=>{
      // Network/CORS failures land here even on a successful server-side write,
      // since the request is fire-and-forget from the browser's perspective —
      // Apps Script doesn't send back CORS headers. We still show success to the
      // client; the real signal is the row appearing in the Sheet.
      console.warn('CRM webhook request may not have completed cleanly:', err);
    })
    .finally(()=>{
      requestModal.classList.add('submitted');
      requestSuccess.classList.add('visible');
      if(submitBtn) submitBtn.disabled = false;
    });
});
