<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Roadmap — таймлайн</title>
<style>
  .viz-root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:      #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --track-0: #2a78d6; /* Бизнес — blue */
    --track-1: #eb6834; /* Здоровье — orange */
    --track-2: #1baf7a; /* Время — aqua */
    --track-3: #eda100; /* Репутация — yellow */
    --track-4: #e87ba4; /* Семья — magenta */
    --track-5: #008300; /* Почта/Мессенджеры — green */
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page-plane:      #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --track-0: #3987e5;
      --track-1: #d95926;
      --track-2: #199e70;
      --track-3: #c98500;
      --track-4: #d55181;
      --track-5: #008300;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page-plane:      #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --track-0: #3987e5;
    --track-1: #d95926;
    --track-2: #199e70;
    --track-3: #c98500;
    --track-4: #d55181;
    --track-5: #008300;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page-plane);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text-primary);
  }
  .viz-root { max-width: 1180px; margin: 0 auto; padding: 32px 20px 60px; }

  h1 { font-size: 22px; margin: 0 0 4px; }
  .subtitle { color: var(--text-secondary); font-size: 13px; margin: 0 0 24px; }

  .legend {
    display: flex; flex-wrap: wrap; gap: 14px 20px;
    margin-bottom: 20px; padding: 12px 16px;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
  }
  .legend-item { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-secondary); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }

  .scroll-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-1); }
  .timeline { min-width: 900px; padding: 8px 24px 20px; position: relative; }

  .month-row { display: flex; height: 28px; position: relative; margin-left: 150px; border-bottom: 1px solid var(--gridline); }
  .month-label { position: absolute; top: 4px; font-size: 12px; color: var(--text-muted); }

  .lane {
    display: flex; align-items: stretch; min-height: 78px;
    border-bottom: 1px solid var(--gridline);
  }
  .lane:last-child { border-bottom: none; }
  .lane-label {
    width: 150px; flex: none; display: flex; align-items: center; gap: 8px;
    font-size: 12.5px; font-weight: 600; color: var(--text-primary); padding-right: 10px;
  }
  .lane-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .lane-track { flex: 1; position: relative; }

  .gridline { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--gridline); }
  .today-line { position: absolute; top: -28px; bottom: 0; width: 1px; background: var(--baseline); border-left: 1px dashed var(--baseline); }
  .today-label {
    position: absolute; top: -26px; transform: translateX(-50%);
    font-size: 10.5px; color: var(--text-muted); white-space: nowrap;
  }

  .marker {
    position: absolute; top: 50%; transform: translate(-50%, -50%);
    width: 11px; height: 11px; border-radius: 50%;
    border: 2px solid var(--surface-1);
    cursor: default;
  }
  .marker-label {
    position: absolute; top: calc(50% + 10px); transform: translateX(-50%);
    font-size: 11px; line-height: 1.25; color: var(--text-secondary);
    width: 108px; text-align: center;
  }
  .marker-label b { color: var(--text-primary); font-weight: 600; }
  .marker-label.above { top: auto; bottom: calc(50% + 10px); }

  .continuous-band {
    position: absolute; top: 50%; left: 0; right: 0; height: 5px; transform: translateY(-50%);
    border-radius: 3px; opacity: 0.35;
  }

  .notes {
    margin-top: 26px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 12px;
  }
  .note-card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px;
  }
  .note-title { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; margin-bottom: 6px; }
  .note-title .lane-dot { width: 8px; height: 8px; }
  .note-card ul { margin: 0; padding-left: 18px; font-size: 12px; color: var(--text-secondary); line-height: 1.5; }

  footer { margin-top: 24px; font-size: 11.5px; color: var(--text-muted); }
</style>
</head>
<body>
<div class="viz-root">
  <h1>Mission Roadmap — таймлайн</h1>
  <p class="subtitle">27.07.2026 — 30.09.2026 · локальный файл, никуда не публикуется · источник: tasks/mission-roadmap.md</p>

  <div class="legend" id="legend"></div>

  <div class="scroll-wrap">
    <div class="timeline" id="timeline">
      <div class="month-row" id="monthRow"></div>
      <div id="lanes"></div>
    </div>
  </div>

  <div class="notes" id="notes"></div>

  <footer>Наведи курсор на точку, чтобы увидеть полную формулировку задачи.</footer>
</div>

<script>
const START = new Date('2026-07-27');
const END   = new Date('2026-09-30');
const TODAY = new Date('2026-07-27');

const tracks = [
  { name: 'Бизнес', color: 'var(--track-0)' },
  { name: 'Здоровье', color: 'var(--track-1)' },
  { name: 'Время / риск', color: 'var(--track-2)' },
  { name: 'Репутация', color: 'var(--track-3)' },
  { name: 'Семья / личное', color: 'var(--track-4)' },
  { name: 'Почта / связь', color: 'var(--track-5)' },
];

// Dated milestones — placed on the timeline
const events = [
  { track: 0, date: '2026-07-28', label: 'Первый business review', full: 'Первый еженедельный business review АвтоЭксперт (пн/вт, 30–45 мин) — выручка, клиенты, чек-ин с сотрудниками, статус помещения.' },
  { track: 0, date: '2026-09-07', label: 'Решение: IT-партнёрство', full: 'Дедлайн решения по IT/парсинг-партнёрству — вернуться, выйти или пересмотреть роль.' },
  { track: 0, date: '2026-09-27', label: 'Ответ спонсора: стройка', full: 'Дедлайн на чёткий да/нет от спонсора по проекту стройки.' },

  { track: 1, date: '2026-07-28', label: 'Старт: зал (2×/нед)', full: 'Первая силовая тренировка в зале, далее 2 раза в неделю.' },
  { track: 1, date: '2026-08-11', label: 'Старт: теннис (≈)', full: 'Добавление тенниса 1×/нед, через 1–2 недели после старта зала (оценочная дата).' },

  { track: 3, date: '2026-07-27', label: 'Смета с клиента — уже действует', full: 'Письменная смета/акт до начала работы — действует со следующего нового клиента, без даты окончания.' },

  { track: 4, date: '2026-08-01', label: 'Старт греческого (≈)', full: 'Начало изучения греческого языка (для гражданства) — июль/начало августа, оценочно.' },
  { track: 4, date: '2026-08-08', label: 'Страховка билетов мамы', full: 'Дедлайн на проверку/оформление страховки авиабилетов мамы (Revolut под вопросом — оформить отдельно).' },
  { track: 4, date: '2026-08-10', label: 'Виза + психолог', full: '10.08: проверка полноты пакета документов мамы/сестры на визу Кипра, и дедлайн записи на пробную сессию к психологу.' },
  { track: 4, date: '2026-09-16', label: 'Вылет мамы и сестры', full: 'Ориентировочный вылет мамы и сестры на Кипр, маршрут Москва–Ереван–Ларнака.' },

  { track: 5, date: '2026-07-28', label: 'Проверить принтер (ePrint)', full: 'Проверить на самом принтере (HP Smart Tank 530) email-адрес для HP ePrint.' },
];

// Continuous / no fixed date — shown as a low-opacity band + listed in notes
const continuousTracks = [0, 2, 5]; // Бизнес (поиск помещения), Время (key-person risk), Почта (сортировка правило в наблюдении)

const notes = [
  { track: 0, title: 'Бизнес — без даты', items: [
    'Поиск помещения под вторую точку — идёт непрерывно (обзвон контактов).',
    'Motus: CRM (5 хвостов) и сайт/соцсети — отдельная сессия, не запланирована.',
  ]},
  { track: 1, title: 'Здоровье — без даты', items: [
    'Чекап — записался, ждёт ответа клиники (дата не в его руках).',
    'Мотоцикл, картинг, ходьба — без изменений / гибкий паттерн.',
  ]},
  { track: 2, title: 'Время / риск — без даты', items: [
    'Диверсификация + работа с командой — постоянный процесс, не разовая задача.',
  ]},
  { track: 4, title: 'Семья — без даты', items: [
    'AI-навыки — параллельно, органически.',
    'Racing progression (Audi TT под гонки) — крупная цель, план не детализирован.',
  ]},
  { track: 5, title: 'Почта / связь — без даты', items: [
    'Правило сортировки инвойсов — уточнится после недели наблюдения.',
    'Объединение мессенджеров (Rambox/MultiMessenger) и бизнес-инбокс (Kommo/Umnico) — инструмент не выбран.',
  ]},
];

function dayFrac(d) {
  return (d - START) / (END - START) * 100;
}

const legend = document.getElementById('legend');
tracks.forEach(t => {
  const el = document.createElement('div');
  el.className = 'legend-item';
  el.innerHTML = `<span class="legend-dot" style="background:${t.color}"></span>${t.name}`;
  legend.appendChild(el);
});

const monthRow = document.getElementById('monthRow');
['2026-08-01', '2026-09-01'].forEach(m => {
  const d = new Date(m);
  const el = document.createElement('div');
  el.className = 'month-label';
  el.style.left = dayFrac(d) + '%';
  el.textContent = d.toLocaleDateString('ru-RU', { month: 'long' });
  monthRow.appendChild(el);
});

const lanesEl = document.getElementById('lanes');
tracks.forEach((t, i) => {
  const lane = document.createElement('div');
  lane.className = 'lane';

  const label = document.createElement('div');
  label.className = 'lane-label';
  label.innerHTML = `<span class="lane-dot" style="background:${t.color}"></span>${t.name}`;
  lane.appendChild(label);

  const track = document.createElement('div');
  track.className = 'lane-track';

  [ '2026-08-01', '2026-09-01' ].forEach(m => {
    const gl = document.createElement('div');
    gl.className = 'gridline';
    gl.style.left = dayFrac(new Date(m)) + '%';
    track.appendChild(gl);
  });

  const todayLine = document.createElement('div');
  todayLine.className = 'today-line';
  todayLine.style.left = dayFrac(TODAY) + '%';
  track.appendChild(todayLine);
  if (i === 0) {
    const tl = document.createElement('div');
    tl.className = 'today-label';
    tl.style.left = dayFrac(TODAY) + '%';
    tl.textContent = 'сегодня';
    track.appendChild(tl);
  }

  if (continuousTracks.includes(i)) {
    const band = document.createElement('div');
    band.className = 'continuous-band';
    band.style.background = t.color;
    band.title = 'Непрерывный процесс, без фиксированной даты';
    track.appendChild(band);
  }

  events.filter(e => e.track === i).forEach((e, idx) => {
    const x = dayFrac(new Date(e.date));
    const marker = document.createElement('div');
    marker.className = 'marker';
    marker.style.left = x + '%';
    marker.style.background = t.color;
    marker.title = e.full;
    track.appendChild(marker);

    const lbl = document.createElement('div');
    lbl.className = 'marker-label' + (idx % 2 === 1 ? ' above' : '');
    lbl.style.left = x + '%';
    lbl.title = e.full;
    const d = new Date(e.date);
    lbl.innerHTML = `<b>${d.toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit'})}</b> ${e.label}`;
    track.appendChild(lbl);
  });

  lane.appendChild(track);
  lanesEl.appendChild(lane);
});

const notesEl = document.getElementById('notes');
notes.forEach(n => {
  const card = document.createElement('div');
  card.className = 'note-card';
  const t = tracks[n.track];
  card.innerHTML = `<div class="note-title"><span class="lane-dot" style="background:${t.color}"></span>${n.title}</div>
    <ul>${n.items.map(i => `<li>${i}</li>`).join('')}</ul>`;
  notesEl.appendChild(card);
});
</script>
</body>
</html>
